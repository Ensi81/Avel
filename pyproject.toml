[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-interchange"
version = "0.1.0"
description = "Python SDK for the Agent Payment Interchange"
requires-python = ">=3.9"
# eth-account è ora una dipendenza di base (non più solo di deposit()):
# pay()/withdraw() richiedono una firma EIP-191 dalla chiave privata
# dell'agente da quando l'Interchange ha aggiunto l'autenticazione
# wallet trust-on-first-use su /pay, /withdraw e /balance (vedi
# docs/AIS_CONTROL_PLANE.md, sezione "Audit di sicurezza completo").
dependencies = ["httpx>=0.27", "eth-account>=0.13"]

[project.optional-dependencies]
# Solo per InterchangeClient.deposit() — richiede l'handshake x402
# completo (asincrono, negoziazione del pagamento), non solo una firma.
# Version pinned to match the main repo's own x402 integration, verified
# together in the same session.
deposit = ["x402[httpx,evm]==2.20.0"]

# Solo per agent_interchange.mcp_server — espone verify()/
# issue_challenge()/verify_challenge()/get_verdict() come tool MCP.
# Non verificato dal vivo in questo repo (build nativa di rpds-py fallita
# nell'ambiente di sviluppo, stesso vincolo gia' documentato per
# langchain-core/crewai/autogen-core in framework_tools.py) — vedi la
# HONESTY NOTE in mcp_server.py.
mcp = ["mcp>=1.0"]

[tool.setuptools.packages.find]
include = ["agent_interchange*"]
